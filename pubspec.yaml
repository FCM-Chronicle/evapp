# pubspec.yaml

name: evapp
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  permission_handler: ^13.0.0
  path_provider: ^2.1.6
  sqflite: ^2.4.3
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  battery_plus: ^7.1.1
  http: ^1.6.0
  flutter_background_service: ^5.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  network_info_plus: ^7.0.0
  flutter_blue_plus: ^2.3.12
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.2.3
  file_picker: 10.3.10
  syncfusion_flutter_pdf: ^34.2.3
  flutter_local_notifications: ^22.3.0
  geolocator: ^14.0.2
  speech_to_text: ^7.4.0
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "web/icons/Icon-512.png"

flutter:

  uses-material-design: true

  assets:
    - assets/ 
    - assets/web/
    - assets/web/assets/